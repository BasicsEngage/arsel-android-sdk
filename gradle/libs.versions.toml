[versions]
agp = "8.5.2"
kotlin = "2.0.21"
coroutines = "1.9.0"
coreKtx = "1.13.1"
annotation = "1.8.2"
activity = "1.9.3"
workManager = "2.9.1"
firebaseMessaging = "24.1.0"
appcompat = "1.7.0"
startup = "1.1.1"
junit = "4.13.2"
# 0.36.0+ requires AGP 8.13; 0.35.0 is the newest line compatible with AGP 8.5.x.
mavenPublish = "0.35.0"
# Real org.json for JVM unit tests. The mockable android.jar stubs every org.json method, so
# without this the parser and body builders cannot be tested off-device at all.
json = "20231013"
ktlint = "12.1.2"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebaseMessaging" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-startup = { module = "androidx.startup:startup-runtime", version.ref = "startup" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "json" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
